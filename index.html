<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Flappy Bird Clone 🐤 — Day 14 featured build</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>🐤 Flappy Bird Clone</h1>
    <p class="hint">Tap, click, or press <kbd>Space</kbd> to flap. Squeeze through the pipes!</p>

    <!-- The game canvas: fixed internal resolution, scaled by CSS -->
    <canvas id="game" width="420" height="560" aria-label="Flappy bird game"></canvas>

    <div class="hud">
      <div>Score <strong id="score">0</strong></div>
      <div>Best <strong id="best">0</strong></div>
    </div>

    <!-- Overlay screens: only one is visible at a time -->
    <div id="overlay">
      <div id="start-screen" class="screen">
        <h2>Get ready!</h2>
        <p>Flap with <kbd>Space</kbd> / click / tap</p>
        <button id="start-btn">▶ Start</button>
      </div>
      <div id="over-screen" class="screen hidden">
        <h2>Game over 💥</h2>
        <p>You scored <strong id="final-score">0</strong> pipes</p>
        <p id="new-best" class="hidden">🏆 New best score!</p>
        <button id="restart-btn">↻ Play again</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
